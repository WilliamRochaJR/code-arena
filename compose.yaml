services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: code_arena
      POSTGRES_PASSWORD: code_arena
      POSTGRES_USER: code_arena
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U code_arena -d code_arena']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - code-arena-postgres-data:/var/lib/postgresql/data

volumes:
  code-arena-postgres-data:
