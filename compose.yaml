services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-code_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code_arena}
      POSTGRES_USER: ${POSTGRES_USER:-code_arena}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - code-arena-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:-code_arena}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-code_arena}
      DB_USERNAME: ${POSTGRES_USER:-code_arena}
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    ports:
      - '${API_PORT:-8080}:8080'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    init: true
    ports:
      - '${WEB_PORT:-3000}:8080'

  prometheus:
    image: prom/prometheus:v3.13.2
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:9090/-/healthy',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - code-arena-prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.1
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    init: true
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./observability/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./observability/grafana/provisioning/dashboards/code-arena.yml:/etc/grafana/provisioning/dashboards/code-arena.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - code-arena-grafana-data:/var/lib/grafana

volumes:
  code-arena-grafana-data:
  code-arena-postgres-data:
  code-arena-prometheus-data:
