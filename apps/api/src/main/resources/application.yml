spring:
  application:
    name: code-arena-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  shutdown: graceful
