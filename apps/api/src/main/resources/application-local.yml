spring:
  datasource:
    password: ${DB_PASSWORD:code_arena}
    url: ${DB_URL:jdbc:postgresql://localhost:5433/code_arena}
    username: ${DB_USERNAME:code_arena}

logging:
  level:
    com.williamrocha.codearena: DEBUG

code-arena:
  identity:
    controlled:
      display-name: ${CONTROLLED_USER_DISPLAY_NAME:Local Developer}
      email: ${CONTROLLED_USER_EMAIL:developer@localhost}
      subject: ${CONTROLLED_USER_SUBJECT:local-development-user}
