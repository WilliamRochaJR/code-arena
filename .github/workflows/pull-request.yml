name: Pull Request

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pull-request-policy:
    name: Pull request policy
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test branch policy
        run: bash .github/scripts/validate-pull-request-branch.test.sh

      - name: Validate pull request branches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/validate-pull-request-branch.sh "$BASE_REF" "$HEAD_REF"

  javascript-quality:
    name: JavaScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  java-quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:e2e:install -- --with-deps

      - name: Start application
        run: docker compose up --detach --build postgres api web

      - name: Wait for application
        run: |
          curl \
            --fail \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            http://127.0.0.1:3000

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color postgres api web > docker-compose.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-failure
          path: |
            docker-compose.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down --volumes
